<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Darıca Gücü • Yo-Yo IR1 Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="logo" class="logo">
      <div>
        <h1>Darıca Gücü <span>Yo-Yo IR1 Lab</span></h1>
        <p class="sub" id="connStatus">Performans &amp; Dayanıklılık Takibi</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="live">Canlı Test</button>
      <button class="tab" data-view="athletes">Sporcular</button>
      <button class="tab" data-view="reports">Raporlar</button>
    </nav>
  </header>

  <main>
    <!-- ============ CANLI TEST ============ -->
    <section id="view-live" class="view active">
      <!-- Kurulum kartı -->
      <div id="setupCard" class="card setup">
        <h2>Yeni Test Oturumu</h2>
        <div class="form-grid">
          <label>Oturum Adı<input id="sTitle" type="text" placeholder="Örn: Sezon Başı Dayanıklılık Testi"></label>
          <label>Grup
            <select id="sGroup"></select>
          </label>
          <label>Tarih<input id="sDate" type="date"></label>
          <label>Mekân<input id="sLocation" type="text" placeholder="Örn: Darıca Sentetik Saha"></label>
        </div>
        <h3>Teste Katılacak Sporcular</h3>
        <div id="pickAthletes" class="pick-grid"></div>
        <button id="btnStartSetup" class="btn primary big">Testi Başlat</button>
      </div>

      <!-- Canlı pist -->
      <div id="liveCard" class="live hidden">
        <div class="live-head">
          <div class="stage-box">
            <div class="stage-top"><span class="lvl" id="curLevel">1</span><span class="lvl-label">SEVİYE</span></div>
            <div class="stage-mid"><span class="shuttle" id="curShuttle">1</span><span class="lvl-label">MEKİK</span></div>
            <div class="stage-bot">
              <span class="speed" id="curSpeed">13.0</span><span class="lvl-label">KM/S</span>
              <span class="dist" id="curDist">0</span><span class="lvl-label">M</span>
            </div>
          </div>
          <div class="meta-box">
            <p><b id="liveTitle"></b></p>
            <p id="liveMeta" class="dim"></p>
            <p class="timer" id="liveTimer">00:00</p>
            <p class="dim" id="livePhase">Hazır</p>
          </div>
          <div class="ctrl-box">
            <button id="btnPause" class="btn gold">Duraklat</button>
            <button id="btnStop" class="btn danger">Bitir &amp; Kaydet</button>
          </div>
        </div>
        <div id="athleteBoard" class="board"></div>
      </div>
    </section>

    <!-- ============ SPORCULAR ============ -->
    <section id="view-athletes" class="view">
      <div class="card">
        <h2>Sporcu Ekle</h2>
        <div class="form-grid">
          <label>Ad Soyad<input id="aName" type="text" placeholder="Örn: Arda Kaya"></label>
          <label>Mevki
            <select id="aPosition">
              <option value="GK">Kaleci (GK)</option>
              <option value="DF">Defans (DF)</option>
              <option value="MF">Orta Saha (MF)</option>
              <option value="FW">Forvet (FW)</option>
            </select>
          </label>
          <label>Forma No<input id="aJersey" type="number" min="1" max="99"></label>
          <label>Doğum Yılı<input id="aBirth" type="number" min="2000" max="2018"></label>
          <label>Grup<input id="aGroup" type="text" placeholder="Örn: U13"></label>
        </div>
        <button id="btnAddAthlete" class="btn primary">Sporcuyu Kaydet</button>
      </div>
      <div class="card">
        <h2>Kadro <span id="athleteCount" class="pill"></span></h2>
        <div id="athleteList" class="athlete-list"></div>
      </div>
    </section>

    <!-- ============ RAPORLAR ============ -->
    <section id="view-reports" class="view">
      <div class="card">
        <h2>Test Oturumları</h2>
        <div id="sessionList" class="session-list"></div>
      </div>
      <div id="reportDetail" class="hidden card report">
        <div class="report-head no-print">
          <button id="btnBackReport" class="btn ghost">← Geri</button>
          <button id="btnPrint" class="btn gold">A4 Yazdır / PDF</button>
        </div>
        <div id="reportBody"></div>
      </div>
    </section>
  </main>

  <footer class="foot">Darıca Gücü Spor Kulübü • Yo-Yo Intermittent Recovery Test Level 1</footer>
</div>

<div id="toast" class="toast"></div>
<audio id="beepSound" preload="auto"></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
